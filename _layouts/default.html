<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
        <div class="nav-links">
          <a href="{{ '/guides/' | relative_url }}">Guides</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://github.com/prompt-stack" target="_blank" rel="noopener">GitHub</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="site-content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>{{ site.description }}</p>
      <p class="footer-links">
        <a href="https://github.com/prompt-stack">GitHub</a> •
        <a href="{{ '/guides/' | relative_url }}">Guides</a> •
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
      </p>
      <p class="footer-note">Built with AI-assisted development. The code is real, the deployments work.</p>
    </div>
  </footer>
</body>
</html>
